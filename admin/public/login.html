<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/admin/favicon.ico" sizes="any">
<title>Sign in · Featherspress</title>
<style>
  :root {
    --bg: #FFFFFF; --bg-2: #FAF8F5; --ink: #121212; --ink-soft: #67665F; --ink-faint: #A9A79E;
    --rule: #ECE9E2; --accent: #B5451B;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI Variable', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg-2); color: var(--ink); font-family: var(--sans); font-size: 15px;
  }
  form {
    width: 100%; max-width: 320px; background: var(--bg); border: 1px solid var(--rule);
    border-radius: 10px; padding: 28px; margin: 16px;
  }
  h1 { font-size: 1.05rem; margin: 0 0 4px; }
  .sub { color: var(--ink-faint); font-size: 0.82rem; margin: 0 0 20px; }
  label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--ink-soft); margin: 16px 0 6px; }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%; padding: 9px 11px; border: 1px solid var(--rule); border-radius: 6px;
    background: var(--bg-2); color: var(--ink); font-family: var(--sans); font-size: 0.92rem;
  }
  input[name=code] { letter-spacing: 0.2em; font-variant-numeric: tabular-nums; }
  button {
    width: 100%; margin-top: 20px; background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 10px 18px; font-size: 0.9rem; font-weight: 600; cursor: pointer; font-family: var(--sans);
  }
  button:hover { opacity: 0.9; }
  .err {
    margin-top: 14px; padding: 9px 12px; border-radius: 6px; font-size: 0.85rem;
    background: #FBE7E4; color: #8A2A1B;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<form id="login-form">
  <h1>Featherspress · authoring</h1>
  <p class="sub">Password + code from your authenticator app.</p>

  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>

  <label for="code">6-digit code, or a recovery code</label>
  <input id="code" name="code" type="text" maxlength="20" autocomplete="one-time-code" required>

  <button type="submit">Sign in</button>
  <div id="err" class="err" hidden></div>
</form>

<script>
  const form = document.getElementById('login-form');
  const err = document.getElementById('err');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.hidden = true;
    const password = document.getElementById('password').value;
    const code = document.getElementById('code').value;
    const res = await fetch('/admin/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password, code }),
    });
    if (res.ok) {
      window.location.href = '/admin/';
      return;
    }
    const data = await res.json().catch(() => ({}));
    err.textContent = data.error || 'Sign in failed';
    err.hidden = false;
  });
</script>
</body>
</html>
