name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Backups and migration archives are age-encrypted, and the tests for that
      # shell out to the real binary. Without it the round-trip tests SKIP —
      # which for this path is the same as failing, and has bitten us before: a
      # skip once hid a wholly broken decrypt. Keygen doesn't even skip, it errors.
      - name: Install age (encryption tests must actually run)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - run: age --version && age-keygen --version
      - run: npm ci
      - run: npm test

  converter:
    name: Converter tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r converter/requirements.txt
      - run: python converter/test_convert.py
