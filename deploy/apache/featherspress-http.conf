# Plain-HTTP Featherspress vhost — the whole site, no TLS on this box.
#
# Use this INSTEAD of featherspress.conf + featherspress-le-ssl.conf when:
#   - TLS is terminated in front of you (Cloudflare, a load balancer, a
#     tunnel), so this box legitimately speaks HTTP; or
#   - you are bringing a box up and don't have a certificate yet (a test box,
#     or before the first certbot run).
#
# If the box IS internet-facing and terminates its own TLS, don't use this one:
# take featherspress.conf (the :80 -> :443 redirect) plus featherspress-le-ssl.conf.
# Serving /admin over plain HTTP puts the password and TOTP code on the wire.

<VirtualHost *:80>
    ServerName example.com

    # Featherspress has NO static build: the Node engine renders everything on
    # request. So Apache reverse-proxies the whole site to it, EXCEPT /media,
    # which is served straight off disk for efficiency.

    # --- Media: served static from the media data dir (fast, no proxying big
    #     files). Directory listing OFF. Must come BEFORE ProxyPass so it wins.
    ProxyPass /media !
    Alias /media /var/lib/featherspress/media
    <Directory /var/lib/featherspress/media>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # Optional: long cache for immutable uploads.
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=2592000"
        </IfModule>
    </Directory>

    # --- Everything else -> the Node engine on localhost.
    ProxyPreserveHost On
    # Behind a TLS terminator, set this to "https" so the engine builds absolute
    # URLs with the scheme the BROWSER used, not the one this hop used.
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass / http://127.0.0.1:8787/
    ProxyPassReverse / http://127.0.0.1:8787/

    ErrorLog ${APACHE_LOG_DIR}/featherspress-error.log
    CustomLog ${APACHE_LOG_DIR}/featherspress-access.log combined
</VirtualHost>
