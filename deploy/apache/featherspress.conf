<VirtualHost *:80>
    ServerName example.com

    # Standard certbot HTTP->HTTPS redirect. If your live vhost has extra
    # directives (custom logging, security headers, RewriteRules), merge them
    # in first; see docs/DEPLOY.md.
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =example.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/featherspress-error.log
    CustomLog ${APACHE_LOG_DIR}/featherspress-access.log combined
</VirtualHost>
