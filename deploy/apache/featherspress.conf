# Featherspress vhost for ONE site (instance @INSTANCE@), on plain HTTP.
# deploy/add-instance.sh fills in @DOMAIN@, @PORT@ and @INSTANCE@, puts its
# ALIASES="..." names on the ServerAlias line (or drops the line when there
# are none), and writes it to
# /etc/apache2/sites-available/featherspress-@INSTANCE@.conf.
#
# For HTTPS, run `certbot --apache -d @DOMAIN@` afterwards: it copies this
# vhost into a :443 one with the certificate and makes this one redirect.
# Behind Cloudflare (or another TLS terminator) this file can stay as it is.

<VirtualHost *:80>
    ServerName @DOMAIN@
    ServerAlias @ALIASES@

    # The Node engine renders everything on request, so Apache proxies the
    # whole site to it, EXCEPT /media, which it serves straight off disk.
    ProxyPass /media !
    Alias /media /var/lib/featherspress/@INSTANCE@/media
    <Directory /var/lib/featherspress/@INSTANCE@/media>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=2592000"
        </IfModule>
    </Directory>

    # Everything else -> this site's engine on localhost.
    ProxyPreserveHost On
    # The scheme the browser used here (https once certbot has copied this
    # vhost to :443), so /admin's cookie is marked Secure over HTTPS. Behind a
    # TLS terminator that talks plain HTTP to this box, set it to "https".
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    ProxyPass / http://127.0.0.1:@PORT@/
    ProxyPassReverse / http://127.0.0.1:@PORT@/

    ErrorLog ${APACHE_LOG_DIR}/featherspress-@INSTANCE@-error.log
    CustomLog ${APACHE_LOG_DIR}/featherspress-@INSTANCE@-access.log combined
</VirtualHost>
