<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName example.com

    # Featherspress has NO static build: the Node engine renders everything on
    # request. So Apache reverse-proxies the whole site to it, EXCEPT /media,
    # which is served straight off disk for efficiency.

    # --- Media: served static from the media data dir (fast, no proxying big
    #     files). Directory listing OFF. Must come BEFORE ProxyPass so it wins.
    ProxyPass /media !
    Alias /media /var/lib/featherspress/media
    <Directory /var/lib/featherspress/media>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # Optional: long cache for immutable uploads.
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=2592000"
        </IfModule>
        # Optional hotlink protection: uncomment and set your own host to allow
        # only your pages (and direct hits with no referer) to load media:
        # <IfModule mod_rewrite.c>
        #     RewriteEngine On
        #     RewriteCond %{HTTP_REFERER} !^$
        #     RewriteCond %{HTTP_REFERER} !^https?://(www\.)?example\.com/ [NC]
        #     RewriteRule \.(jpg|jpeg|png|gif|webp)$ - [F,NC]
        # </IfModule>
    </Directory>

    # --- Everything else -> the Node engine on localhost.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:8787/
    ProxyPassReverse / http://127.0.0.1:8787/

    ErrorLog ${APACHE_LOG_DIR}/featherspress-error.log
    CustomLog ${APACHE_LOG_DIR}/featherspress-access.log combined

    # Point these at your own certificate (e.g. Let's Encrypt / certbot).
    SSLCertificateFile /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
